services:
  mysql:
    image: mysql:8.0
    container_name: umfg-lembretes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: umfg_lembrete_develop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api/umfg.programacaoiii.minimalapi.2026
    container_name: umfg-lembretes-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionString: "Server=mysql;Port=3306;Database=umfg_lembrete_develop;Uid=root;Pwd=root;"
    ports:
      - "5207:8080"

volumes:
  mysql_data: